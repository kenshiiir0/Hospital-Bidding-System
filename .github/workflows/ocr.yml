# Layer 1 of reading scanned bid documents (OCR): every hour from 6:30 AM to 6:30 PM Philippine time, on
# GitHub's free computers (the deployed server on Vercel has too little computing time for OCR).
# Runs frontend/scripts/ocr-job.mjs. Needs the repository secrets SUPABASE_URL and SUPABASE_KEY
# (Settings > Secrets and variables > Actions). Can also be started by hand: Actions > Read scanned documents > Run workflow.
name: Read scanned documents (OCR)

on:
  schedule:
    - cron: '30 22,23,0-10 * * *' # UTC; = 6:30 AM to 6:30 PM in the Philippines
  workflow_dispatch:

# One run at a time; a run still going when the next is due finishes first
concurrency:
  group: ocr
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Read scanned documents
        run: node scripts/ocr-job.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
